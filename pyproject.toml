[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-rag"
version = "0.1.0"
description = "Academics-only PDF RAG foundation with local Ollama preprocessing and selective OpenAI usage."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "beautifulsoup4>=4.12,<5",
  "chromadb>=0.5,<1",
  "httpx>=0.27,<1",
  "ollama>=0.4,<1",
  "openai>=1.60,<2",
  "pypdf>=5,<7",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
academic-rag = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

